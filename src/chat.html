<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="fonts/fonts.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk to the Commissar</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
    header canvas { width: 40px; height: 40px; image-rendering: pixelated; border-radius: 6px; background: #070606; }
    header .who { flex: 1; }
    #log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 9px 12px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: #2a2620; }
    .model { align-self: flex-start; background: var(--panel); border-left: 4px solid var(--red); font-family: 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; }
    .err { align-self: center; color: #e57368; font-size: 12px; }
    .quiz { align-self: stretch; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 8px; padding: 12px; }
    .quiz .q { font: 15px/1.45 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; margin-bottom: 10px; }
    .quiz button { display: block; width: 100%; text-align: left; margin: 6px 0; }
    .quiz button.right { border-color: var(--green); background: rgba(79,154,85,.15); }
    .quiz button.wrong { border-color: var(--red); background: rgba(192,57,43,.15); }
    .quiz .exp { margin-top: 8px; font: 14px/1.45 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; color: var(--muted); }
    .bar { padding: 10px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
    .bar .row input { flex: 1; }
    #off { margin: 16px; }
  </style>
</head>
<body>
  <header>
    <canvas id="face" width="32" height="30" aria-hidden="true"></canvas>
    <div class="who"><h1 style="font-size:16px">The Commissar</h1><div class="muted small" id="usage"></div></div>
  </header>
  <div id="off" class="note small" hidden></div>
  <div id="log" aria-live="polite"></div>
  <div class="bar">
    <div class="row">
      <input id="topic" type="text" maxlength="80" placeholder="Quiz topic (empty: your subject)" aria-label="Quiz topic">
      <button id="quizMe" class="shrink">Quiz me</button>
      <button id="randomQuiz" class="shrink">Random</button>
    </div>
    <form id="form" class="row">
      <input id="text" type="text" maxlength="1500" placeholder="Ask a study question…" autocomplete="off" aria-label="Message">
      <button class="primary shrink" type="submit">Send</button>
    </form>
    <div class="muted small">Messages go to Google Gemini with your key. Gemini can be wrong: check what matters.</div>
  </div>
  <script type="module" src="chat.js"></script>
</body>
</html>
