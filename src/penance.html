<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="fonts/fonts.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penance</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; color: #eee6d3; font: 15px/1.5 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; }
    body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    .card { width: min(560px, 100%); border: 1px solid #3a342a; border-top: 6px solid #c0392b; border-radius: 6px; padding: 22px;
            background: #15130f; box-shadow: 0 20px 60px rgba(0, 0, 0, .7); }
    h1 { margin: 0 0 6px; font: 600 13px/1.2 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; color: #c0392b; }
    .why { margin: 0 0 10px; }
    .line { font-size: 19px; margin: 10px 0 14px; user-select: none; -webkit-user-select: none; }
    input { width: 100%; box-sizing: border-box; padding: 9px 10px; font: 16px/1.3 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; background: #1e1b16; color: #eee6d3;
            border: 1px solid #3a342a; border-radius: 5px; }
    input:focus { outline: 2px solid #c9a227; outline-offset: 1px; }
    input.bad { border-color: #c0392b; animation: no .3s; }
    .count { font: 600 13px/1.3 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; color: #e57368; margin-top: 10px; }
    .hint { font: 12px/1.4 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; color: #a39a86; margin-top: 8px; }
    .done { color: #c9a227; }
    @keyframes no { 0%, 100% { transform: translateX(0) } 33% { transform: translateX(-6px) } 66% { transform: translateX(5px) } }
    @media (prefers-reduced-motion: reduce) { input.bad { animation: none; } }
  </style>
</head>
<body>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="title">
    <h1 id="title">Commissar: judgment</h1>
    <p class="why" id="why">Repeated desertion. Write your penance.</p>
    <div class="line" id="line"></div>
    <input id="input" type="text" autocomplete="off" spellcheck="false" aria-describedby="count hint">
    <div class="count" id="count" aria-live="polite"></div>
    <div class="hint" id="hint">Type it by hand, then press Enter. No pasting. Closing the tab does not cancel it: the next distraction you open carries the same sentence.</div>
  </div>
  <script type="module" src="penance.js"></script>
</body>
</html>
