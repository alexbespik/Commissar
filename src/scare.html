<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="fonts/fonts.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commissar</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070606; color: #eee6d3; overflow: hidden; }
    #stage { position: fixed; inset: 0 0 150px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #stage svg { height: 100%; max-width: 100%; transform-origin: 50% 45%; will-change: transform; }
    .text { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; padding: 0 16px; font: 15px/1.4 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; }
    .big { font: 700 44px/1 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: .08em; color: #ff3b2f; text-shadow: 0 0 18px rgba(255, 40, 30, .6); margin-bottom: 8px; }
    button { margin-top: 12px; background: #c0392b; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font: 600 15px 'Commissar Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; cursor: pointer; }
    button:focus-visible { outline: 2px solid #c9a227; outline-offset: 2px; }
    .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    /* small, inside the watch window */
    .embed #stage { inset: 0 0 92px 0; }
    .embed .text { bottom: 8px; font-size: 12px; }
    .embed .big { font-size: 26px; margin-bottom: 4px; }
    .embed button { margin-top: 6px; padding: 6px 12px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="flash" id="flash"></div>
  <div class="text">
    <div class="big" id="big"></div>
    <div id="line"></div>
    <button id="back">Back to my post</button>
  </div>
  <script type="module" src="scare.js"></script>
</body>
</html>
